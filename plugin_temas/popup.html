<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Tema y Cuentagotas</h1>
    <p id="site" class="muted">—</p>
  </header>

  <section id="controls">
    <h2 class="title">Temas</h2>
    <div class="theme">
      <div class="track" id="track" role="group" aria-label="Temas" data-mode="light">
        <button type="button" id="darkBtn" class="opt moon" aria-label="Oscuro" title="Oscuro" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" id="lightBtn" class="opt sun" aria-label="Claro" title="Claro" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="knob" aria-hidden="true"></span>
      </div>
    </div>
    <p id="autoNote" class="muted note" hidden>Sigue el tema del navegador</p>
    <button type="button" id="autoBtn" class="link note" hidden>Usar el tema del navegador</button>
    <button id="pick" class="primary">Capturar color</button>
  </section>

  <p id="unavailable" class="muted" hidden>
    Esta página no permite extensiones (por ejemplo, páginas internas del navegador o la tienda de extensiones). Abre un sitio web normal.
  </p>

  <section>
    <div class="head">
      <h2>Colores recientes</h2>
      <button id="clear" class="link">Borrar</button>
    </div>
    <div id="history" class="history"></div>
    <p id="empty" class="muted">Aún no has capturado ningún color.</p>
    <p id="toast" class="toast" aria-live="polite"></p>
  </section>
  <script src="popup.js"></script>
</body>
</html>
